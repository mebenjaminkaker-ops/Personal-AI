<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dark AI Studio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  
  <!-- Vazirmatn Persian Font -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    body {
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    
    /* Code Blocks LTR Override */
    pre, code, .code-block {
      direction: ltr !important;
      text-align: left !important;
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
    }
    
    pre {
      background-color: #121215 !important;
      border: 1px solid #27272a;
      border-radius: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      position: relative;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* Markdown Styling */
    .prose p { margin-bottom: 0.75rem; line-height: 1.7; }
    .prose ul { list-style-type: disc; padding-right: 1.5rem; margin-bottom: 0.75rem; }
    .prose ol { list-style-type: decimal; padding-right: 1.5rem; margin-bottom: 0.75rem; }
    .prose h1, .prose h2, .prose h3 { font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: #ffffff; }
    .prose blockquote { border-right: 4px solid #3b82f6; padding-right: 1rem; color: #a1a1aa; margin: 0.5rem 0; }
  </style>
</head>
<body class="h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-80 bg-[#121215] border-l border-zinc-800 flex flex-col transition-all duration-300 absolute md:relative z-20 h-full -right-80 md:right-0">
    <!-- Header / New Chat -->
    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <button onclick="startNewChat()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg flex items-center justify-center gap-2 font-medium transition">
        <i class="fa-solid fa-plus text-sm"></i>
        <span>گفتگو جدید</span>
      </button>
      <button onclick="toggleSidebar()" class="md:hidden text-zinc-400 hover:text-white mr-2 p-2">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Conversations List -->
    <div id="chats-list" class="flex-1 overflow-y-auto p-3 space-y-2">
      <!-- Chat items inserted dynamically -->
    </div>

    <!-- API Key & Settings Footer -->
    <div class="p-4 border-t border-zinc-800 bg-[#0d0d0f] space-y-3">
      <div>
        <label class="block text-xs text-zinc-400 mb-1 font-medium">کلید ارتباطی (API Key):</label>
        <div class="relative">
          <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-zinc-900 border border-zinc-700 rounded-md px-3 py-1.5 text-xs text-zinc-100 focus:outline-none focus:border-blue-500 pl-8">
          <button onclick="toggleKeyVisibility()" class="absolute left-2 top-2 text-zinc-500 hover:text-zinc-300 text-xs">
            <i id="key-eye-icon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>
      <button onclick="saveApiKey()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs py-1.5 rounded-md transition font-medium">
        ذخیره تنظیمات
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-full bg-[#09090b] relative">
    
    <!-- Top Navbar -->
    <header class="h-14 border-b border-zinc-800 bg-[#121215]/80 backdrop-blur-md px-4 flex items-center justify-between z-10">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden text-zinc-400 hover:text-white p-2">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <span class="font-bold text-base text-zinc-100 flex items-center gap-2">
          <i class="fa-solid fa-brain text-blue-500"></i>
          استودیو هوش مصنوعی
        </span>
      </div>

      <!-- Controls: Model Selector & Thinking Effort -->
      <div class="flex items-center gap-2">
        <!-- Model Selection Dropdown -->
        <div class="relative">
          <select id="model-select" onchange="onModelChange()" class="bg-zinc-900 border border-zinc-700 text-zinc-200 text-xs rounded-lg px-2.5 py-1.5 outline-none focus:border-blue-500 cursor-pointer">
            <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (Preview)</option>
          </select>
        </div>

        <!-- Thinking Mode Selector (Conditional) -->
        <div id="thinking-container" class="hidden sm:flex items-center gap-1 bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1">
          <i class="fa-solid fa-lightbulb text-amber-400 text-xs"></i>
          <select id="thinking-select" class="bg-transparent text-zinc-300 text-xs outline-none cursor-pointer">
            <option value="auto">تفکر: خودکار</option>
            <option value="high">تفکر: عمیق (High)</option>
            <option value="low">تفکر: سریع (Low)</option>
            <option value="off">تفکر: خاموش</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Chat Messages Viewport -->
    <div id="chat-viewport" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
      <!-- Empty State -->
      <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-6 text-zinc-500 space-y-4">
        <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-blue-500 text-2xl">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <h2 class="text-xl font-bold text-zinc-200">چگونه می‌توانم کمکتان کنم؟</h2>
        <p class="text-xs text-zinc-400 max-w-sm">یک مدل انتخاب کنید، کلید اختصاصی خود را وارد کرده و گفتگو را شروع کنید.</p>
      </div>
    </div>

    <!-- Bottom Message Input Area -->
    <div class="p-3 md:p-4 border-t border-zinc-800 bg-[#0d0d0f]">
      <div class="max-w-4xl mx-auto relative flex items-end bg-zinc-900 border border-zinc-700/80 rounded-xl focus-within:border-blue-500 p-2">
        <textarea id="message-input" rows="1" placeholder="پیام خود را بنویسید..." class="w-full bg-transparent text-zinc-100 text-sm px-2 py-1 outline-none resize-none max-h-32" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
        
        <button id="send-btn" onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-2.5 w-10 h-10 flex items-center justify-center transition disabled:opacity-50 disabled:cursor-not-allowed mr-2">
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </div>
      <div class="text-[10px] text-zinc-500 text-center mt-2">
        پشتیبانی کامل از مارک‌داون، زبان فارسی و کدهای LTR.
      </div>
    </div>

  </main>

  <script>
    // State Management
    let chats = JSON.parse(localStorage.getItem('ai_chats') || '[]');
    let currentChatId = null;
    let apiKey = localStorage.getItem('gemini_api_key') || '';

    // Init App
    window.onload = () => {
      if (apiKey) {
        document.getElementById('api-key-input').value = apiKey;
      }
      renderChatsList();
      onModelChange();
    };

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('-right-80');
      sidebar.classList.toggle('right-0');
    }

    function toggleKeyVisibility() {
      const input = document.getElementById('api-key-input');
      const icon = document.getElementById('key-eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      apiKey = val;
      localStorage.setItem('gemini_api_key', val);
      alert('کلید ارتباطی با موفقیت ذخیره شد.');
    }

    function onModelChange() {
      const model = document.getElementById('model-select').value;
      const thinkingContainer = document.getElementById('thinking-container');
      // Show thinking effort option for models that support reasoning config
      if (model.includes('3.7') || model.includes('3.1') || model.includes('2.5')) {
        thinkingContainer.classList.remove('hidden');
      } else {
        thinkingContainer.classList.add('hidden');
      }
    }

    // Chat History Functions
    function renderChatsList() {
      const listEl = document.getElementById('chats-list');
      listEl.innerHTML = '';
      
      chats.forEach(chat => {
        const item = document.createElement('div');
        const isActive = chat.id === currentChatId;
        item.className = `group flex items-center justify-between p-2.5 rounded-lg text-xs cursor-pointer transition ${isActive ? 'bg-zinc-800 text-white font-medium' : 'text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200'}`;
        item.onclick = () => loadChat(chat.id);
        
        item.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <i class="fa-regular fa-message"></i>
            <span class="truncate">${escapeHtml(chat.title)}</span>
          </div>
          <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-red-400 p-1 transition">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        listEl.appendChild(item);
      });
    }

    function startNewChat() {
      currentChatId = null;
      document.getElementById('chat-viewport').innerHTML = `
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-6 text-zinc-500 space-y-4">
          <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-blue-500 text-2xl">
            <i class="fa-solid fa-bolt"></i>
          </div>
          <h2 class="text-xl font-bold text-zinc-200">چگونه می‌توانم کمکتان کنم؟</h2>
          <p class="text-xs text-zinc-400 max-w-sm">یک مدل انتخاب کنید، کلید اختصاصی خود را وارد کرده و گفتگو را شروع کنید.</p>
        </div>
      `;
      renderChatsList();
    }

    function loadChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      if (!chat) return;

      const viewport = document.getElementById('chat-viewport');
      viewport.innerHTML = '';
      chat.messages.forEach(msg => {
        appendMessageUI(msg.role, msg.text);
      });
      renderChatsList();
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      localStorage.setItem('ai_chats', JSON.stringify(chats));
      if (currentChatId === id) {
        startNewChat();
      } else {
        renderChatsList();
      }
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert('لطفاً ابتدا API Key خود را در منوی تنظیمات وارد کنید.');
        return;
      }

      // Hide empty state if present
      const emptyState = document.getElementById('empty-state');
      if (emptyState) emptyState.remove();

      // UI setup for user message
      appendMessageUI('user', text);
      inputEl.value = '';
      inputEl.style.height = 'auto';

      // Ensure active chat instance
      if (!currentChatId) {
        currentChatId = Date.now().toString();
        chats.unshift({
          id: currentChatId,
          title: text.slice(0, 30) + '...',
          messages: []
        });
      }

      const activeChat = chats.find(c => c.id === currentChatId);
      activeChat.messages.push({ role: 'user', text });
      saveChats();

      // AI Response Loader
      const aiMsgEl = appendMessageUI('model', 'در حال اندیشیدن...');

      try {
        const model = document.getElementById('model-select').value;
        const thinkingEffort = document.getElementById('thinking-select').value;

        // Build Payload
        const contents = activeChat.messages.map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.text }]
        }));

        const payload = { contents };

        // Handle Thinking Configuration if supported
        if (thinkingEffort !== 'off' && (model.includes('3.7') || model.includes('3.1') || model.includes('2.5'))) {
          payload.generationConfig = {
            thinkingConfig: {
              thinkingBudget: thinkingEffort === 'high' ? 8192 : (thinkingEffort === 'low' ? 1024 : 0)
            }
          };
        }

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || 'خطا در دریافت پاسخ از هوش مصنوعی');
        }

        const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'پاسخی دریافت نشد.';

        // Render AI Response
        updateMessageUI(aiMsgEl, aiText);
        activeChat.messages.push({ role: 'model', text: aiText });
        saveChats();

      } catch (err) {
        updateMessageUI(aiMsgEl, `**خطا:** ${err.message}`);
      }
    }

    function appendMessageUI(role, text) {
      const viewport = document.getElementById('chat-viewport');
      const wrapper = document.createElement('div');
      wrapper.className = `flex ${role === 'user' ? 'justify-start' : 'justify-end'} mb-4`;

      const msgBox = document.createElement('div');
      msgBox.className = `max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
        role === 'user' 
          ? 'bg-blue-600/90 text-white rounded-br-none' 
          : 'bg-[#18181c] border border-zinc-800 text-zinc-100 rounded-bl-none prose'
      }`;

      if (role === 'user') {
        msgBox.textContent = text;
      } else {
        msgBox.innerHTML = renderMarkdown(text);
      }

      wrapper.appendChild(msgBox);
      viewport.appendChild(wrapper);
      viewport.scrollTop = viewport.scrollHeight;

      return msgBox;
    }

    function updateMessageUI(el, text) {
      el.innerHTML = renderMarkdown(text);
      const viewport = document.getElementById('chat-viewport');
      viewport.scrollTop = viewport.scrollHeight;
    }

    // Helper Functions
    function renderMarkdown(rawText) {
      marked.setOptions({
        highlight: function(code, lang) {
          const language = hljs.getLanguage(lang) ? lang : 'plaintext';
          return hljs.highlight(code, { language }).value;
        }
      });

      let html = marked.parse(rawText);

      // Wrap pre blocks with custom container and copy button
      const tempContainer = document.createElement('div');
      tempContainer.innerHTML = html;

      const preElements = tempContainer.querySelectorAll('pre');
      preElements.forEach((pre) => {
        const codeText = pre.innerText;
        const codeWrapper = document.createElement('div');
        codeWrapper.className = 'relative group my-2';
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'absolute top-2 right-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[10px] px-2 py-1 rounded border border-zinc-700 opacity-0 group-hover:opacity-100 transition z-10';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> کپی';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(codeText);
          copyBtn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> کپی شد';
          setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> کپی', 2000);
        };

        pre.parentNode.insertBefore(codeWrapper, pre);
        codeWrapper.appendChild(copyBtn);
        codeWrapper.appendChild(pre);
      });

      return tempContainer.innerHTML;
    }

    function saveChats() {
      localStorage.setItem('ai_chats', JSON.stringify(chats));
      renderChatsList();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
    </html>
