<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal AI Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0b0e;
      --panel-bg: #16161a;
      --user-msg: #1d283a;
      --ai-msg: #222227;
      --accent: #2563eb;
      --text: #f3f4f6;
      --border: #27272a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: system-ui, -apple-system, Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 12px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .header-title {
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      width: 100%;
    }
    input, select, button {
      background: #1e1e24;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }
    select {
      flex: 1;
      min-width: 130px;
      max-width: 100%;
    }
    .key-input {
      width: 110px;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .user {
      align-self: flex-start;
      background: var(--user-msg);
      border-bottom-right-radius: 2px;
    }
    .ai {
      align-self: flex-end;
      background: var(--ai-msg);
      border-bottom-left-radius: 2px;
      width: fit-content;
      max-width: 92%;
    }
    .msg pre {
      direction: ltr;
      text-align: left;
      background: #000;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg code {
      font-family: monospace;
      font-size: 12px;
    }
    .file-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    .file-preview img {
      max-height: 40px;
      border-radius: 4px;
    }
    .input-area {
      padding: 8px 10px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .input-area textarea {
      flex: 1;
      background: #1e1e24;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      resize: none;
      height: 38px;
      outline: none;
      font-family: inherit;
    }
    .btn-send {
      background: var(--accent);
      border: none;
      padding: 8px 14px;
      font-weight: bold;
    }
    .file-btn {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #1e1e24;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">Personal AI</div>
    <div class="controls">
      <input type="password" id="apiKey" class="key-input" placeholder="API Key" onchange="fetchModels()">
      <select id="modelSelect"><option value="">در حال اسکن مدل‌ها...</option></select>
    </div>
  </header>

  <div id="chat-box"></div>

  <div id="previewArea" class="file-preview" style="display:none;">
    <span id="fileName">فایل انتخاب شد</span>
    <button onclick="clearFile()" style="padding: 2px 6px; background:#ef4444;">✕</button>
  </div>

  <div class="input-area">
    <label class="file-btn">
      📎
      <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
    </label>
    <textarea id="userInput" placeholder="پیام یا کد..." rows="1"></textarea>
    <button class="btn-send" onclick="sendMsg()">ارسال</button>
  </div>

  <script>
    let activeFile = null;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        fetchModels();
      }
    };

    async function fetchModels() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return;
      localStorage.setItem('gemini_api_key', key);

      const select = document.getElementById('modelSelect');
      select.innerHTML = '<option value="">در حال اسکن...</option>';

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        const data = await res.json();
        
        if (data.models) {
          select.innerHTML = '';
          const generateModels = data.models.filter(m => m.supportedGenerationMethods?.includes('generateContent'));
          
          generateModels.forEach(m => {
            const cleanName = m.name.replace('models/', '');
            const option = document.createElement('option');
            option.value = cleanName;
            option.innerText = m.displayName || cleanName;
            if (cleanName.includes('3.8-flash') || cleanName.includes('3.5-flash')) option.selected = true;
            select.appendChild(option);
          });
        }
      } catch (err) {
        select.innerHTML = '<option value="">خطا در دریافت مدل‌ها</option>';
      }
    }

    function handleFile(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Data = e.target.result.split(',')[1];
        activeFile = {
          inlineData: {
            mimeType: file.type || 'application/octet-stream',
            data: base64Data
          }
        };
        document.getElementById('fileName').innerText = `📎 ${file.name}`;
        document.getElementById('previewArea').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearFile() {
      activeFile = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('previewArea').style.display = 'none';
    }

    async function sendMsg() {
      const key = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('modelSelect').value;
      const input = document.getElementById('userInput');
      const box = document.getElementById('chat-box');

      if (!key) return alert('لطفاً ابتدا API Key را وارد کنید.');
      if (!input.value.trim() && !activeFile) return;

      const userText = input.value.trim();
      box.innerHTML += `<div class="msg user">${userText} ${activeFile ? '<br><i>[فایل پیوست شد]</i>' : ''}</div>`;
      
      const contents = [{ parts: [] }];
      if (userText) contents[0].parts.push({ text: userText });
      if (activeFile) contents[0].parts.push(activeFile);

      input.value = '';
      clearFile();
      box.scrollTop = box.scrollHeight;

      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg ai';
      aiMsg.innerText = 'در حال پاسخ...';
      box.appendChild(aiMsg);

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents })
        });
        const data = await res.json();
        
        if (data.candidates && data.candidates[0].content) {
          const replyText = data.candidates[0].content.parts[0].text;
          aiMsg.innerHTML = marked.parse(replyText);
        } else {
          aiMsg.innerText = 'خطا: ' + (data.error?.message || 'پاسخی دریافت نشد.');
        }
      } catch (err) {
        aiMsg.innerText = 'خطا در ارتباط با API!';
      }
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
