<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal AI Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: #0d0d0d;
      --user-msg: #d97706; /* نارنجی شیک */
      --ai-msg: #000000;
      --text: #ffffff;
      --border: #222222;
      --neon-glow: 0 0 10px rgba(59, 130, 246, 0.5), 0 0 20px rgba(59, 130, 246, 0.2);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    
    /* هدر */
    header {
      padding: 10px 12px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 10;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }
    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex: 1;
      justify-content: flex-end;
    }
    input, select {
      background: #141414;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }
    select {
      max-width: 160px;
      flex: 1;
    }
    .key-input {
      width: 100px;
    }

    /* سیدبار سوابق */
    #sidebar {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100%;
      background: #080808;
      border-left: 1px solid var(--border);
      z-index: 100;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    #sidebar.open { right: 0; }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .new-chat-btn {
      width: 100%;
      padding: 10px;
      background: #1f1f1f;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      font-weight: bold;
    }
    #historyList {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      padding: 10px;
      background: #121212;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }
    .history-item.active {
      border-color: #d97706;
    }

    /* باکس چت */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      color: #ffffff;
    }
    /* پیام کاربر */
    .user {
      align-self: flex-start;
      background-color: var(--user-msg);
      border-bottom-right-radius: 2px;
    }
    /* پیام هوش مصنوعی با نوار نازک نورانی */
    .ai {
      align-self: flex-end;
      background-color: var(--ai-msg);
      border: 1px solid #3b82f6;
      box-shadow: var(--neon-glow);
      border-bottom-left-radius: 2px;
    }
    .msg pre {
      direction: ltr;
      text-align: left;
      background: #050505;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid #222;
    }
    .msg code {
      font-family: monospace;
      font-size: 12px;
    }

    /* پیش‌نمایش فایل */
    .file-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: #0a0a0a;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    /* نوار ارسال پیام */
    .input-wrapper {
      padding: 10px 12px;
      background: #000000;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .plus-btn {
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0 4px;
      line-height: 1;
    }
    .input-box {
      flex: 1;
      background: #000000;
      border: 1px solid #333333;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 4px 6px 4px 12px;
    }
    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 13px;
      resize: none;
      height: 24px;
      max-height: 80px;
      outline: none;
      direction: rtl;
      font-family: inherit;
    }
    .input-box textarea::placeholder {
      color: #ffffff;
      opacity: 0.8;
      font-weight: 300;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
    }
    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- کشوی سوابق -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span>گفتگوهای اخیر</span>
      <button class="icon-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">+ گفتگوی جدید</button>
    <div id="historyList"></div>
  </div>

  <!-- هدر -->
  <header>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <span style="font-weight: bold; font-size: 13px;">Personal AI</span>
    </div>
    <div class="controls">
      <input type="password" id="apiKey" class="key-input" placeholder="API Key" onchange="fetchModels()">
      <select id="modelSelect"><option value="">اسکن مدل‌ها...</option></select>
    </div>
  </header>

  <!-- کادر پیام‌ها -->
  <div id="chat-box"></div>

  <!-- پیش‌نمایش فایل -->
  <div id="previewArea" class="file-preview" style="display:none;">
    <span id="fileName">فایل انتخاب شد</span>
    <button onclick="clearFile()" style="background:none; border:none; color:#ef4444; cursor:pointer;">✕</button>
  </div>

  <!-- نوار نوشتن -->
  <div class="input-wrapper">
    <label class="plus-btn">
      +
      <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
    </label>
    <div class="input-box">
      <textarea id="userInput" placeholder="پرسیدن از AI" rows="1" onkeydown="checkEnter(event)"></textarea>
      <button class="send-btn" onclick="sendMsg()">↑</button>
    </div>
  </div>

  <script>
    let activeFile = null;
    let chats = JSON.parse(localStorage.getItem('ai_chats') || '{}');
    let currentChatId = null;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        fetchModels();
      }
      renderHistory();
      if (Object.keys(chats).length > 0) {
        loadChat(Object.keys(chats)[0]);
      } else {
        startNewChat();
      }
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      Object.keys(chats).forEach(id => {
        const item = document.createElement('div');
        item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
        item.innerText = chats[id].title || 'گفتگوی بدون عنوان';
        item.onclick = () => { loadChat(id); toggleSidebar(); };
        list.appendChild(item);
      });
    }

    function startNewChat() {
      currentChatId = 'chat_' + Date.now();
      chats[currentChatId] = { title: 'گفتگوی جدید', messages: [] };
      saveChats();
      renderHistory();
      renderMessages();
    }

    function loadChat(id) {
      currentChatId = id;
      renderHistory();
      renderMessages();
    }

    function saveChats() {
      localStorage.setItem('ai_chats', JSON.stringify(chats));
    }

    function renderMessages() {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      if (!currentChatId || !chats[currentChatId]) return;

      chats[currentChatId].messages.forEach(m => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${m.role}`;
        msgDiv.innerHTML = m.role === 'ai' ? marked.parse(m.text) : m.text;
        box.appendChild(msgDiv);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function fetchModels() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return;
      localStorage.setItem('gemini_api_key', key);

      const select = document.getElementById('modelSelect');
      select.innerHTML = '<option value="">اسکن...</option>';

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        const data = await res.json();
        
        if (data.models) {
          select.innerHTML = '';
          const generateModels = data.models.filter(m => m.supportedGenerationMethods?.includes('generateContent'));
          
          generateModels.forEach(m => {
            const cleanName = m.name.replace('models/', '');
            const option = document.createElement('option');
            option.value = cleanName;
            option.innerText = m.displayName || cleanName;
            if (cleanName.includes('3.8-flash') || cleanName.includes('3.5-flash')) option.selected = true;
            select.appendChild(option);
          });
        }
      } catch (err) {
        select.innerHTML = '<option value="">خطا در اسکن</option>';
      }
    }

    function handleFile(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        activeFile = {
          inlineData: {
            mimeType: file.type || 'application/octet-stream',
            data: e.target.result.split(',')[1]
          }
        };
        document.getElementById('fileName').innerText = `📎 ${file.name}`;
        document.getElementById('previewArea').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearFile() {
      activeFile = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('previewArea').style.display = 'none';
    }

    function checkEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    }

    async function sendMsg() {
      const key = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('modelSelect').value;
      const input = document.getElementById('userInput');
      const box = document.getElementById('chat-box');

      if (!key) return alert('لطفاً ابتدا API Key را وارد کنید.');
      if (!input.value.trim() && !activeFile) return;

      const userText = input.value.trim();
      
      // افزودن پیام کاربر به حافظه
      chats[currentChatId].messages.push({ role: 'user', text: userText + (activeFile ? ' [فایل پیوست شد]' : '') });
      if (chats[currentChatId].messages.length === 1) {
        chats[currentChatId].title = userText.substring(0, 20) + '...';
      }
      
      saveChats();
      renderHistory();
      renderMessages();

      // ساخت پرامپت با حفظ سابقه (Context)
      const apiContents = chats[currentChatId].messages.map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      }));

      if (activeFile) {
        apiContents[apiContents.length - 1].parts.push(activeFile);
      }

      input.value = '';
      clearFile();

      // پیام در حال پاسخ هوش مصنوعی
      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'msg ai';
      aiMsgDiv.innerText = 'در حال پاسخ...';
      box.appendChild(aiMsgDiv);
      box.scrollTop = box.scrollHeight;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: apiContents })
        });
        const data = await res.json();
        
        if (data.candidates && data.candidates[0].content) {
          const replyText = data.candidates[0].content.parts[0].text;
          chats[currentChatId].messages.push({ role: 'ai', text: replyText });
        } else {
          chats[currentChatId].messages.push({ role: 'ai', text: 'خطا: ' + (data.error?.message || 'پاسخی دریافت نشد.') });
        }
      } catch (err) {
        chats[currentChatId].messages.push({ role: 'ai', text: 'خطا در ارتباط با API!' });
      }

      saveChats();
      renderMessages();
    }
  </script>
</body>
</html>
