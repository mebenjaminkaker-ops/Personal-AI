<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={
  gemini:{n:'Google Gemini',t:'g',u:'https://generativelanguage.googleapis.com/v1beta',def:['gemini-1.5-flash','gemini-1.5-pro','gemini-1.0-pro']},
  openai:{n:'OpenAI',t:'o',u:'https://api.openai.com/v1',def:['gpt-4o','gpt-4o-mini','gpt-3.5-turbo']},
  anthropic:{n:'Anthropic Claude',t:'a',u:'https://api.anthropic.com/v1',def:['claude-3-5-sonnet-20240620','claude-3-opus-20240229']},
  groq:{n:'Groq',t:'o',u:'https://api.groq.com/openai/v1',def:['openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.1-8b-instant','mixtral-8x7b-32768']},
  openrouter:{n:'OpenRouter',t:'o',u:'https://openrouter.ai/api/v1',def:['auto','google/gemini-pro','openai/gpt-4o']},
  mistral:{n:'Mistral',t:'o',u:'https://api.mistral.ai/v1',def:['mistral-large-latest','mistral-small-latest']},
  deepseek:{n:'DeepSeek',t:'o',u:'https://api.deepseek.com/v1',def:['deepseek-chat','deepseek-coder']},
  cerebras:{n:'Cerebras',t:'o',u:'https://api.cerebras.ai/v1',def:['llama3.1-70b','llama3.1-8b']},
  xai:{n:'xAI Grok',t:'o',u:'https://api.x.ai/v1',def:['grok-beta','grok-2-mini']},
  custom:{n:'سفارشی (سازگار با OpenAI)',t:'o',u:'',def:['gpt-3.5-turbo']}
};
const jget=(s,k,d)=>{try{return JSON.parse(s.getItem(k))||d}catch{return d}};
let cfg=Object.assign({prov:'gemini',m:{},base:'',sys:'',search:true,remember:false},jget(localStorage,'pai_cfg',{}));
let keys=jget(localStorage,'pai_keys',null)||jget(sessionStorage,'pai_keys',{});
let chats=jget(localStorage,'ai_chats',{}), cur=null, file=null, busy=false, ctl=null, models={};

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function saveCfg(){cfg.sys=$('sSys').value;cfg.search=$('sSearch').checked;cfg.remember=$('sRem').checked;try{localStorage.setItem('pai_cfg',JSON.stringify(cfg))}catch{}}
function saveKeys(){try{const s=JSON.stringify(keys);sessionStorage.setItem('pai_keys',s);cfg.remember?localStorage.setItem('pai_keys',s):localStorage.removeItem('pai_keys')}catch{}}
function saveChats(){try{localStorage.setItem('ai_chats',JSON.stringify(chats))}catch{toast('حافظه‌ی مرورگر پر است؛ گفتگوهای قدیمی را حذف کنید.')}}

function inl(t){return t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function md(src){
  return src.split('```').map((p,i)=>{
    if(i%2){const n=p.indexOf('\n');return '<pre><code>'+esc(n<0?p:p.slice(n+1))+'</code></pre>'}
    let out='',list='';const close=()=>{if(list){out+='</'+list+'>';list=''}};
    esc(p).split('\n').forEach(l=>{
      const ul=l.match(/^\s*[-*•]\s+(.*)/),ol=l.match(/^\s*\d+[.)]\s+(.*)/),h=l.match(/^#{1,4}\s+(.*)/),q=l.match(/^&gt;\s?(.*)/);
      if(ul||ol){const t=ul?'ul':'ol';if(list!==t){close();out+='<'+t+'>';list=t}out+='<li>'+inl((ul||ol)[1])+'</li>'}
      else{close();if(h)out+='<h4>'+inl(h[1])+'</h4>';else if(q)out+='<blockquote>'+inl(q[1])+'</blockquote>';else if(l.trim())out+='<p>'+inl(l)+'</p>'}
    });close();return out}).join('');
}

function openSide(){$('side').classList.add('open');$('shade').classList.add('show')}
function closeAll(){$('side').classList.remove('open');$('shade').classList.remove('show')}
function newChat(){cur=null;closeAll();renderHist();renderMsgs()}
function renderHist(){
  const l=$('hist');l.innerHTML='';
  Object.keys(chats).reverse().forEach(id=>{
    const it=document.createElement('div');it.className='hi'+(id===cur?' act':'');
    const t=document.createElement('button');t.className='t';t.textContent=chats[id].title||'گفتگوی بدون عنوان';
    t.onclick=()=>{cur=id;closeAll();renderHist();renderMsgs()};
    const m=document.createElement('button');m.className='m';m.textContent='···';
    const dd=document.createElement('div');dd.className='dd';
    const r=document.createElement('button');r.textContent='تغییر نام';
    r.onclick=e=>{e.stopPropagation();const n=prompt('نام جدید گفتگو:',chats[id].title);if(n&&n.trim()){chats[id].title=n.trim();saveChats();renderHist()}};
    const d=document.createElement('button');d.textContent='حذف';d.style.color='#ef4444';
    d.onclick=e=>{e.stopPropagation();if(confirm('این گفتگو حذف شود؟')){delete chats[id];if(cur===id)cur=null;saveChats();renderHist();renderMsgs()}};
    m.onclick=e=>{e.stopPropagation();document.querySelectorAll('.dd.show').forEach(x=>x!==dd&&x.classList.remove('show'));dd.classList.toggle('show')};
    dd.append(r,d);it.append(t,m,dd);l.append(it);
  });
}
document.addEventListener('click',()=>document.querySelectorAll('.dd.show').forEach(x=>x.classList.remove('show')));
function bubble(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;$('chat').append(d);return d}
function userHtml(m){return esc(m.text)+(m.file?'<span class="file">📎 '+esc(m.file)+'</span>':'')}
function renderMsgs(){
  const box=$('chat');box.innerHTML='';
  const ms=cur&&chats[cur]?chats[cur].messages:[];
  if(!ms.length){box.innerHTML='<div class="empty"><b>خوش آمدید</b>برای شروع، از ⚙ ارائه‌دهنده و API Key را انتخاب کنید.</div>';return}
  ms.forEach(m=>bubble(m.role==='user'?'user':'ai',m.role==='user'?userHtml(m):md(m.text)));
  box.scrollTop=box.scrollHeight;
}
function onInp(){const i=$('inp');i.style.height='28px';i.style.height=Math.min(i.scrollHeight,120)+'px';$('send').classList.toggle('on',busy||!!i.value.trim()||!!file)}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();sendMsg()}}
function setBusy(b){busy=b;$('send').textContent=b?'■':'↑';onInp()}

function pickFile(el){
  const f=el.files[0];if(!f)return;
  if(f.size>15*1024*1024){toast('حجم فایل نباید بیشتر از ۱۵ مگابایت باشد.');el.value='';return}
  const r=new FileReader();
  r.onload=e=>{file={name:f.name,mime:f.type||'application/octet-stream',data:String(e.target.result).split(',')[1]};$('fname').textContent='📎 '+f.name;$('prev').style.display='flex';onInp()};
  r.onerror=()=>toast('خواندن فایل ناموفق بود.');
  r.readAsDataURL(f);
}
function clearFile(){file=null;$('fin').value='';$('prev').style.display='none';onInp()}
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));

function base(){return cfg.prov==='custom'?cfg.base.trim().replace(/\/+$/,''):P[cfg.prov].u}
function hdrs(){
  const k=keys[cfg.prov]||'',t=P[cfg.prov].t,h={'Content-Type':'application/json'};
  if(t==='g')h['x-goog-api-key']=k;
  else if(t==='a'){h['x-api-key']=k;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true'}
  else h['Authorization']='Bearer '+k;
  return h;
}
function chipText(){const m=cfg.m[cfg.prov];return P[cfg.prov].n+(m?' · '+m:'')}
function fillSet(){
  const s=$('sProv');if(!s.options.length)Object.keys(P).forEach(k=>s.add(new Option(P[k].n,k)));
  s.value=cfg.prov;$('sKey').value=keys[cfg.prov]||'';$('sBase').value=cfg.base;$('sSys').value=cfg.sys;
  $('sSearch').checked=cfg.search;$('sRem').checked=cfg.remember;
  $('rBase').style.display=cfg.prov==='custom'?'':'none';$('rSearch').style.display=cfg.prov==='gemini'?'':'none';
  fillModels();$('chip').textContent=chipText();
}
function fillModels(){
  const s=$('sModel'),list=models[cfg.prov]||P[cfg.prov].def||[],cm=cfg.m[cfg.prov];s.innerHTML='';
  const all=list.slice();if(cm&&!all.includes(cm))all.unshift(cm);
  all.forEach(m=>s.add(new Option(m,m)));s.add(new Option('✎ وارد کردن دستی…','__man'));
  s.value=cm||(all[0]||'__man');
  const man=s.value==='__man';$('sMan').style.display=man?'':'none';
  if(!man&&!cm&&all[0])cfg.m[cfg.prov]=all[0];
}
function openSet(){closeAll();fillSet();$('sheet').classList.add('show')}
function closeSet(){saveCfg();$('sheet').classList.remove('show');$('chip').textContent=chipText()}
function onProv(){cfg.prov=$('sProv').value;saveCfg();fillSet()}
function onBase(){cfg.base=$('sBase').value.trim();saveCfg()}
function onKey2(){keys[cfg.prov]=$('sKey').value.trim();saveKeys()}
function onModel(){const v=$('sModel').value;if(v==='__man'){$('sMan').style.display='';const m=$('sMan').value.trim();if(m)cfg.m[cfg.prov]=m}else{$('sMan').style.display='none';cfg.m[cfg.prov]=v}saveCfg();$('chip').textContent=chipText()}

async function scan(){
  const k=keys[cfg.prov];if(!k){toast('ابتدا API Key را وارد کنید.');return}
  const u=base();const t=P[cfg.prov].t;let url=u+'/models';if(t==='g')url+='?pageSize=1000';if(t==='a')url+='?limit=100';
  $('sModel').innerHTML='<option>در حال اسکن…</option>';
  try{
    const r=await fetch(url,{headers:hdrs()});const j=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(j.error?.message||j.message||('خطای '+r.status));
    let ids=t==='g'?(j.models||[]).filter(m=>m.supportedGenerationMethods?.includes('generateContent')).map(m=>m.name.replace('models/','')):(j.data||[]).map(m=>m.id);
    if(t==='o')ids=ids.filter(i=>!/embed|whisper|tts|dall|moderation|guard|rerank|transcribe|audio|image/i.test(i));
    if(ids.length) models[cfg.prov]=ids.sort();
    toast((ids.length || P[cfg.prov].def.length)+' مدل لیست شد.');
  }catch(e){
    models[cfg.prov]=P[cfg.prov].def;
    toast('مدل‌های پیش‌فرض بارگذاری شدند.');
  }
  fillModels();$('chip').textContent=chipText();
}

function getHist(){const o=[];chats[cur].messages.forEach(m=>{const r=m.role==='user'?'user':'assistant',l=o[o.length-1];if(l&&l.r===r)l.t+='\n\n'+m.text;else o.push({r,t:m.text})});return o}
function payload(h,f,model){
  const T=P[cfg.prov].t,last=h.length-1;let bin=null;
  if(f){
    if(T==='g')bin=f;
    else if(f.mime.startsWith('image/')||(T==='a'&&f.mime==='application/pdf'))bin=f;
    else if(/^text\/|json|xml|csv|javascript/.test(f.mime))h[last].t+='\n\n['+f.name+']\n'+dec(f.data);
    else throw Error('این ارائه‌دهنده فقط تصویر و فایل متنی را می‌پذیرد.');
  }
  const sys=cfg.sys.trim();
  if(T==='g'){
    const b={contents:h.map((x,i)=>({role:x.r==='user'?'user':'model',parts:[{text:x.t}].concat(i===last&&bin?[{inlineData:{mimeType:bin.mime,data:bin.data}}]:[])}))};
    if(sys)b.systemInstruction={parts:[{text:sys}]};
    if(cfg.search)b.tools=[{googleSearch:{}}];
    return {url:`${base()}/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,body:b};
  }
  if(T==='a'){
    const b={model,max_tokens:4096,stream:true,messages:h.map((x,i)=>({role:x.r,content:i===last&&bin?[{type:bin.mime==='application/pdf'?'document':'image',source:{type:'base64',media_type:bin.mime,data:bin.data}},{type:'text',text:x.t}]:x.t}))};
    if(sys)b.system=sys;return {url:base()+'/messages',body:b};
  }
  const ms=h.map((x,i)=>({role:x.r,content:i===last&&bin?[{type:'text',text:x.t},{type:'image_url',image_url:{url:`data:${bin.mime};base64,${bin.data}`}}]:x.t}));
  if(sys)ms.unshift({role:'system',content:sys});
  return {url:base()+'/chat/completions',body:{model,messages:ms,stream:true}};
}
function piece(j){
  const T=P[cfg.prov].t;
  if(j.error)throw Error(j.error.message||JSON.stringify(j.error));
  if(T==='g')return(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
  if(T==='a'){if(j.type==='error')throw Error(j.error?.message||'خطا');return j.type==='content_block_delta'?(j.delta?.text||''):''}
  return j.choices?.[0]?.delta?.content||'';
}
async function readSSE(res,on){
  const rd=res.body.getReader(),d=new TextDecoder();let b='';
  for(;;){const{done,value}=await rd.read();if(done)break;b+=d.decode(value,{stream:true});const L=b.split('\n');b=L.pop();
    for(const l of L)if(l.startsWith('data:')){const s=l.slice(5).trim();if(s&&s!=='[DONE]'){let j;try{j=JSON.parse(s)}catch{continue}on(j)}}}
}
async function sendMsg(){
  if(busy){ctl&&ctl.abort();return}
  const inp=$('inp'),text=inp.value.trim(),f=file;
  if(!text&&!f)return;
  const key=keys[cfg.prov],model=cfg.m[cfg.prov];
  if(!key||!model){toast(!key?'ابتدا API Key را وارد کنید.':'یک مدل انتخاب کنید.');openSet();return}
  if(!cur||!chats[cur]){cur='chat_'+Date.now();chats[cur]={title:(text||f.name).slice(0,30),messages:[]}}
  const ch=chats[cur];ch.messages.push({role:'user',text:text||'(فایل پیوست شد)',file:f?f.name:''});
  inp.value='';clearFile();saveChats();renderHist();renderMsgs();setBusy(true);
  const out=bubble('ai','<div class="dots"><i></i><i></i><i></i></div>');$('chat').scrollTop=1e9;
  let acc='',raf=0;ctl=new AbortController();
  const paint=()=>{raf=0;out.innerHTML=md(acc);$('chat').scrollTop=1e9};
  try{
    const p=payload(getHist(),f,model);
    const res=await fetch(p.url,{method:'POST',headers:hdrs(),body:JSON.stringify(p.body),signal:ctl.signal});
    if(!res.ok){const j=await res.json().catch(()=>({}));throw Error(j.error?.message||j.message||('خطای '+res.status))}
    await readSSE(res,j=>{acc+=piece(j);if(!raf)raf=requestAnimationFrame(paint)});
    if(!acc.trim())throw Error('پاسخی دریافت نشد.');
    ch.messages.push({role:'ai',text:acc});
  }catch(e){
    if(e.name==='AbortError'&&acc.trim())ch.messages.push({role:'ai',text:acc});
    else{
      ch.messages.pop();inp.value=text;
      if(!ch.messages.length){delete chats[cur];cur=null}
      saveChats();renderHist();renderMsgs();setBusy(false);onInp();
      bubble('err',esc(e.message));return;
    }
  }
  if(raf)cancelAnimationFrame(raf);
  saveChats();renderMsgs();setBusy(false);
}
window.onload=()=>{renderHist();renderMsgs();$('chip').textContent=chipText();onInp()};
</script>
</body>
</html>
