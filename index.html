
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meepno Calculator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
.container{height:100vh;width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px}
.icon-btn{background:none;border:none;color:#fff;font-size:1rem;cursor:pointer;font-weight:bold}
.display-screen{width:100%;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;margin-bottom:12px;min-height:85px;direction:ltr}
.expression{font-size:1.1rem;color:#666;min-height:22px;width:100%;text-align:right}
.result{font-size:3.2rem;font-weight:bold;color:#fff;width:100%;text-align:right;overflow-x:auto;white-space:nowrap}
.sci-grid{display:none;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;direction:ltr}
.sci-grid.active{display:grid}
.btn-sci{background:#000;color:#fff;border:1px solid #fff;border-radius:20px;height:42px;font-size:1.1rem;font-weight:bold;cursor:pointer;filter:drop-shadow(0 0 6px #ffffff55)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;direction:ltr}
.btn{background:#000;color:#fff;border:1.5px solid #ddd;border-radius:50%;aspect-ratio:1;font-size:2.2rem;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 0 10px #ffffff40)}
.btn:active{opacity:.7}
.btn-clear{color:#ff5555;border-color:#ff5555;font-size:1.8rem}
.btn-op{background:#fff;color:#000;border:1.5px solid #fff;font-size:2.4rem}
.btn-equal{background:#fff;color:#000;border:1.5px solid #fff;font-size:2.4rem}
.ai-modal{display:none;position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#000f;z-index:100;flex-direction:column;padding:20px;direction:rtl}
.ai-modal.active{display:flex}
.ai-header{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:1.2rem;font-weight:bold;padding-bottom:10px;border-bottom:1px solid #333}
.ai-close{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer}
.ai-body{flex:1;overflow-y:auto;margin:15px 0;display:flex;flex-direction:column;gap:12px}
.ai-input-box{display:flex;gap:10px}
.ai-input{flex:1;min-width:0;background:#111;border:1px solid #444;border-radius:12px;padding:12px;color:#fff;outline:none}
.ai-send{background:#fff;border:none;border-radius:12px;padding:0 16px;color:#000;font-weight:bold;cursor:pointer}
.ai-send:disabled{opacity:.5}
.bubble{padding:11px 13px;border-radius:14px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}
.bubble.user{align-self:flex-end;background:#eee;color:#111;border-radius:14px 14px 4px 14px}
.bubble.bot{align-self:flex-start;background:#101010;color:#fff;border:1px solid #444;box-shadow:0 0 12px #ffffff0d;border-radius:14px 14px 14px 4px}
</style>
</head>

<body>
<div class="container">
  <div class="top-bar">
    <button class="icon-btn" onclick="openAI()">🤖 دستیار AI</button>
    <button class="icon-btn" onclick="toggleSci()" id="sci-toggle-btn">⚡ توابع مهندسی</button>
  </div>

  <div class="display-screen">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="sci-grid" id="sci-grid">
    <button class="btn-sci" onclick="append('sin(')">sin</button>
    <button class="btn-sci" onclick="append('cos(')">cos</button>
    <button class="btn-sci" onclick="append('tan(')">tan</button>
    <button class="btn-sci" onclick="append('π')">π</button>
    <button class="btn-sci" onclick="append('log(')">log</button>
    <button class="btn-sci" onclick="append('ln(')">ln</button>
    <button class="btn-sci" onclick="append('√(')">√</button>
    <button class="btn-sci" onclick="append('^')">x^y</button>
  </div>

  <div class="keypad">
    <button class="btn btn-clear" onclick="clearAll()">AC</button>
    <button class="btn btn-clear" onclick="backspace()">⌫</button>
    <button class="btn" onclick="append('%')">%</button>
    <button class="btn btn-op" onclick="append('÷')">÷</button>
    <button class="btn" onclick="append('7')">7</button>
    <button class="btn" onclick="append('8')">8</button>
    <button class="btn" onclick="append('9')">9</button>
    <button class="btn btn-op" onclick="append('×')">×</button>
    <button class="btn" onclick="append('4')">4</button>
    <button class="btn" onclick="append('5')">5</button>
    <button class="btn" onclick="append('6')">6</button>
    <button class="btn btn-op" onclick="append('-')">-</button>
    <button class="btn" onclick="append('1')">1</button>
    <button class="btn" onclick="append('2')">2</button>
    <button class="btn" onclick="append('3')">3</button>
    <button class="btn btn-op" onclick="append('+')">+</button>
    <button class="btn" onclick="toggleSign()">+/-</button>
    <button class="btn" onclick="append('0')">0</button>
    <button class="btn" onclick="append('.')">.</button>
    <button class="btn btn-equal" onclick="calculate()">=</button>
  </div>
</div>

<div class="ai-modal" id="ai-modal">
  <div class="ai-header">
    <span>🤖 دستیار هوشمند Meepno</span>
    <button class="ai-close" onclick="closeAI()">✕</button>
  </div>
  <div class="ai-body" id="ai-body">
    <div class="bubble bot">سلام! من Meepno هستم، دستیار هوشمند ریاضی. چه مسئله‌ای رو با هم حل کنیم؟</div>
  </div>
  <form class="ai-input-box" id="ai-form">
    <input type="text" class="ai-input" id="ai-input" placeholder="مثلاً: معادله x² - 5x + 6 = 0" autocomplete="off">
    <button class="ai-send" id="ai-send" type="submit">ارسال</button>
  </form>
</div>

<script>
let currentInput = '';
let exprText = '';

const resEl = document.getElementById('result');
const exprEl = document.getElementById('expression');

function update(){
  resEl.innerText = currentInput || '0';
  exprEl.innerText = exprText;
}

function append(val){
  if(currentInput === 'خطا') currentInput = '';
  currentInput += val;
  update();
}

function clearAll(){
  currentInput = '';
  exprText = '';
  update();
}

function backspace(){
  currentInput = currentInput.slice(0,-1);
  update();
}

function toggleSign(){
  if(!currentInput) return;
  if(currentInput.startsWith('-')) currentInput = currentInput.slice(1);
  else currentInput = '-' + currentInput;
  update();
}

function toggleSci(){
  document.getElementById('sci-grid').classList.toggle('active');
}

function calculate(){
  if(!currentInput) return;
  try{
    exprText = currentInput + ' =';
    let p = currentInput
      .replace(/×/g,'*')
      .replace(/÷/g,'/')
      .replace(/π/g,'Math.PI')
      .replace(/√\(/g,'Math.sqrt(')
      .replace(/sin\(/g,'Math.sin(')
      .replace(/cos\(/g,'Math.cos(')
      .replace(/tan\(/g,'Math.tan(')
      .replace(/log\(/g,'Math.log10(')
      .replace(/ln\(/g,'Math.log(')
      .replace(/\^/g,'**');
    const res = Function('"use strict"; return (' + p + ')')();
    if(typeof res !== 'number' || !Number.isFinite(res)) throw new Error('invalid');
    currentInput = String(Number.isInteger(res) ? res : Number(res.toFixed(8)));
  }catch(e){
    currentInput = 'خطا';
  }
  update();
}

function openAI(){
  document.getElementById('ai-modal').classList.add('active');
  document.getElementById('ai-input').focus();
}

function closeAI(){
  document.getElementById('ai-modal').classList.remove('active');
}

/* آدرس واسطهٔ Cloudflare Worker؛ کلید Groq داخل این فایل نیست */
const AI_API_URL = 'https://falling-unit-640c.me-benjaminkaker.workers.dev';

let aiHistory = [];
let aiBusy = false;

function addBubble(text, kind){
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + kind;
  bubble.textContent = text;
  document.getElementById('ai-body').appendChild(bubble);
  document.getElementById('ai-body').scrollTop =
    document.getElementById('ai-body').scrollHeight;
  return bubble;
}

document.getElementById('ai-form').addEventListener('submit', async function(event){
  event.preventDefault();

  const input = document.getElementById('ai-input');
  const button = document.getElementById('ai-send');
  const message = input.value.trim();

  if(!message || aiBusy) return;

  addBubble(message, 'user');
  input.value = '';

  const replyBubble = addBubble('در حال بررسی مسئله…', 'bot');

  aiBusy = true;
  button.disabled = true;
  input.disabled = true;

  aiHistory.push({role:'user', content:message});

  try{
    const response = await fetch(AI_API_URL,{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        messages: aiHistory.slice(-12)
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data?.error || 'خطای API: ' + response.status);
    }

    const answer = data?.choices?.[0]?.message?.content?.trim();
    if(!answer) throw new Error('پاسخی از مدل دریافت نشد.');

    replyBubble.textContent = answer;
    aiHistory.push({role:'assistant',content:answer});

  }catch(error){
    aiHistory.pop();
    replyBubble.textContent =
      'ارتباط با هوش مصنوعی ناموفق بود. اتصال اینترنت و وضعیت Worker و حساب Groq را بررسی کن.\n' +
      error.message;
  }finally{
    aiBusy = false;
    button.disabled = false;
    input.disabled = false;
    input.focus();
    document.getElementById('ai-body').scrollTop =
      document.getElementById('ai-body').scrollHeight;
  }
});
</script>
</body>
</html>
